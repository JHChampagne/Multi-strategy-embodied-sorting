[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embodied-sorting"
version = "0.1.0"
description = "A unified SO-ARM100 MuJoCo workcell for multi-strategy material sorting"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = ["mujoco==3.17.0", "numpy>=2.0,<2.3", "scipy>=1.14,<2", "gymnasium>=1.1,<2", "imageio>=2.35", "imageio-ffmpeg", "pyyaml>=6"]

[project.optional-dependencies]
learning = ["torch>=2.7,<2.12", "torchvision>=0.22,<0.27", "lerobot[dataset,training,smolvla]==0.6.1", "stable-baselines3>=2.7,<3"]
test = ["pytest>=8", "ruff"]

[project.scripts]
workcell = "embodied_sorting.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
embodied_sorting = ["assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
